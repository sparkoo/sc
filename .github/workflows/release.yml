name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag is on master
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged commit is reachable from master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::Release tag must point to a commit reachable from master"
            exit 1
          }

  package:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: sc-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          installers=()
          for suffix in _x64-setup.exe _amd64.AppImage _aarch64.dmg; do
            matches=(release/**/*"$suffix")
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" || ! -s "${matches[0]}" ]]; then
              echo "::error::Expected exactly one nonempty installer ending in $suffix"
              exit 1
            fi
            installers+=("${matches[0]}")
          done
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
