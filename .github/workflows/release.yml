name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: sc-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
