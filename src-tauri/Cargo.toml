[package]
name = "sc-commander"
version = "0.1.0"
edition = "2021"
description = "Two-pane desktop file commander"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
dunce = "1"
open = "5"
renamore = "0.3"
same-file = "1"
trash = "5"
tempfile = "3"
